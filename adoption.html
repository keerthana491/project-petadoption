<!DOCTYPE html>
<html>

<meta charset="UTF-8">

<style>

body {
    margin: 0;
    font-family: Arial, "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    background: linear-gradient(135deg, #e0f7f4, #fff3e0);
}

/* Navigation */

nav {
    background: #00897b;
    padding: 18px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 15px;
    font-weight: bold;
}

nav a:hover {
    color: #ffe0b2;
}

/* Heading */

h1 {
    text-align: center;
    color: #00695c;
    margin-top: 30px;
}

.subtitle {
    text-align: center;
    color: #666;
}

/* Form */

.form-box {
    width: 600px;
    max-width: 85%;
    background: white;
    margin: 30px auto;
    padding: 30px;
    border-radius: 25px;
    box-shadow: 0 8px 25px #bbb;
}

.form-box h2 {
    text-align: center;
    color: #00897b;
}

/* Note */

.note {
    text-align: center;
    background: #e0f2f1;
    padding: 12px;
    border-radius: 12px;
    color: #00695c;
}

/* Labels */

label {
    display: block;
    margin-top: 15px;
    color: #444;
    font-weight: bold;
}

/* Inputs */

input, select, textarea {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    box-sizing: border-box;
    border: 2px solid #d0e5e2;
    border-radius: 10px;
    font-size: 15px;
}

input:focus, select:focus, textarea:focus {
    border-color: #00897b;
    outline: none;
}

/* Submit */

button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    border: none;
    border-radius: 25px;
    background: #ff7043;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #e64a19;
}

/* Footer */

footer {
    background: #00695c;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 40px;
}

</style>

</head>

<h1>🐾 Adoption Application 🐾</h1>

<p class="subtitle">
Give a loving pet a forever home ❤️
</p>


<div class="form-box">

<h2>❤️ Adopter Details</h2>

<p class="note">
Please fill in your details carefully.
</p>


<form action="adoption.php"
      method="POST"
      onsubmit="return validateForm()">


<!-- Name -->

<label>👤 Full Name</label>

<input type="text"
       id="name"
       name="name"
       placeholder="Enter your full name">


<!-- Age -->

<label>🎂 Age</label>

<input type="number"
       id="age"
       name="age"
       placeholder="Enter your age"
       min="1"
       max="69">


<!-- Phone -->

<label>📱 Phone Number</label>

<input type="text"
       id="phone"
       name="phone"
       placeholder="Enter 10 digit phone number"
       maxlength="10">


<!-- Email -->

<label>📧 Email</label>

<input type="text"
       id="email"
       name="email"
       placeholder="example@gmail.com">


<!-- Address -->

<label>🏠 Address</label>

<textarea id="address"
          name="address"
          rows="4"
          placeholder="Enter your complete address"></textarea>


<!-- Pet -->

<label>🐾 Select Pet</label>

<select id="pet" name="pet">

<option value="">-- Select a Pet --</option>

<option value="Bruno">🐶 Bruno - Labrador</option>
<option value="Max">🐶 Max - Beagle</option>
<option value="Rocky">🐕 Rocky - Golden Retriever</option>
<option value="Simba">🐕 Simba - Indian Pariah</option>

<option value="Luna">🐱 Luna - Persian Cat</option>
<option value="Bella">🐱 Bella - Siamese Cat</option>
<option value="Coco">🐈 Coco - Indian Shorthair</option>

<option value="Snowy">🐇 Snowy - Rabbit</option>
<option value="Rio">🦜 Rio - Parrot</option>
<option value="Shelly">🐢 Shelly - Tortoise</option>

</select>


<!-- Reason -->

<label>💭 Why do you want to adopt?</label>

<textarea id="reason"
          name="reason"
          rows="4"
          placeholder="Tell us why you want to adopt this pet"></textarea>


<!-- Submit -->

<button type="submit">
❤️ Submit Adoption Application
</button>

</form>

</div>


<footer>

🐾 Happy Paws Pet Adoption ❤️
<br>
Give a pet a loving home!

</footer>


<script>

/* Form Validation */

function validateForm() {

    var name = document.getElementById("name").value.trim();
    var age = document.getElementById("age").value;
    var phone = document.getElementById("phone").value.trim();
    var email = document.getElementById("email").value.trim();
    var address = document.getElementById("address").value.trim();
    var pet = document.getElementById("pet").value;
    var reason = document.getElementById("reason").value.trim();


    /* Name - letters and spaces only */

    var namePattern = /^[A-Za-z ]+$/;

    if (name == "") {

        alert("Please enter your name.");
        return false;

    }

    if (!namePattern.test(name)) {

        alert("Name must contain letters and spaces only.");
        return false;

    }


    /* Age - 1 to 69 */

    if (age == "" || age < 1 || age >= 70) {

        alert("Age must be between 1 and 69.");
        return false;

    }


    /* Phone - exactly 10 digits */

    var phonePattern = /^[0-9]{10}$/;

    if (!phonePattern.test(phone)) {

        alert("Phone number must contain exactly 10 digits.");
        return false;

    }


    /* Email */

    var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailPattern.test(email)) {

        alert("Please enter a valid email address.");
        return false;

    }


    /* Address */

    if (address.length < 10) {

        alert("Please enter a valid address.");
        return false;

    }


    /* Pet */

    if (pet == "") {

        alert("Please select a pet.");
        return false;

    }


    /* Reason */

    if (reason.length < 5) {

        alert("Please enter your reason for adoption.");
        return false;

    }

/* All details are correct */

alert("All details are valid! Adoption application is being submitted. ❤️");

return true;
   

}


/* Get pet selected from Page 3 */

var selectedPet =
    new URLSearchParams(window.location.search).get("pet");

if (selectedPet) {

    document.getElementById("pet").value = selectedPet;

}

</script>

</body>
